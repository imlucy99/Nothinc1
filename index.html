<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JGVRP Speedometer HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="hud sweeping" id="hud">

    <!-- INTRO: siluet mobil -->
    <div class="intro" id="intro">
      <div class="stage">
        <div class="beam"></div>
        <svg class="car" viewBox="0 0 384 110" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="scan" gradientUnits="userSpaceOnUse" x1="-90" y1="0" x2="-20" y2="0">
              <stop offset="0" stop-color="#ffd21a" />
              <stop offset="1" stop-color="#2c2c32" />
              <animateTransform id="scan-anim" attributeName="gradientTransform" type="translate"
                from="0 0" to="520 0" begin="0.9s" dur="1.3s" fill="freeze" />
            </linearGradient>
          </defs>
          <g fill="url(#scan)">
            <path d="M12,80 L12,72 C12,67 22,65 36,62 L76,54 L112,40 C124,34 140,31 160,31 L212,31 C228,32 240,36 250,43 L272,54 L336,58 L356,50 L374,48 L374,58 C376,68 372,76 366,80 L332,80 A28,28 0 0 0 276,80 L128,80 A28,28 0 0 0 72,80 Z"/>
            <circle cx="100" cy="80" r="24"/>
            <circle cx="304" cy="80" r="24"/>
          </g>
          <circle cx="100" cy="80" r="13" fill="#0a0a0d"/>
          <circle cx="304" cy="80" r="13" fill="#0a0a0d"/>
          <path d="M118,43 L148,36 L210,36 C222,37 232,40 240,46 L252,53" fill="none" stroke="#0a0a0d" stroke-width="1.5"/>
        </svg>
        <div class="intro-brand">JGVRP</div>
      </div>
    </div>

    <!-- BARIS ATAS: sein -->
    <div class="top-bar">
      <div id="indicator-left" class="icon-item arrow">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </div>
      <div id="indicator-right" class="icon-item arrow">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </div>
    </div>

    <div class="main">

      <!-- KOLOM KIRI -->
      <div class="side left">
        <div class="tile" id="tile-map">
          <div class="bar"><i></i></div>
          <div class="body"><span class="val" id="map-val">0</span><span class="unit">psi</span><span class="lbl">MAP</span></div>
        </div>
        <div class="tile" id="tile-cts">
          <div class="bar"><i></i></div>
          <div class="body"><span class="val" id="cts-val">0</span><span class="unit">°C</span><span class="lbl">CTS</span></div>
        </div>
        <div class="tile" id="tile-iat">
          <div class="bar"><i></i></div>
          <div class="body"><span class="val" id="iat-val">0</span><span class="unit">°C</span><span class="lbl">IAT</span></div>
        </div>
        <!-- Injector Duty -> Fuel -->
        <div class="tile" id="tile-fuel">
          <div class="bar"><i></i></div>
          <div class="body"><span class="val" id="fuel-val">--</span><span class="unit">%</span><span class="lbl">FUEL</span></div>
        </div>
      </div>

      <!-- GAUGE RPM -->
      <div class="gauge" id="rpm-gauge">
        <svg id="rpm-svg" viewBox="0 0 240 240"></svg>
        <div class="readout">
          <div class="row big"><span id="rpm-val" class="num">0</span><span class="unit">RPM</span></div>
          <div class="row-lbl">RPM</div>
          <div class="row small"><span id="odometer" class="num">0.0</span><span class="unit" id="odo-unit">mi</span></div>
          <div class="row-lbl">ODO</div>
        </div>
      </div>

      <!-- STRIP TENGAH: lampu indikator -->
      <div class="center-strip">
        <div id="engine-icon" class="ci" title="Check engine">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12c0-.6-.4-1-1-1h-2V9c0-.6-.4-1-1-1h-2V5c0-.6-.4-1-1-1H9c-.6 0-1 .4-1 1v3H6c-.6 0-1 .4-1 1v2H3c-.6 0-1 .4-1 1v3c0 .6.4 1 1 1h2v2c0 .6.4 1 1 1h12c.6 0 1-.4 1-1v-2h2c.6 0 1-.4 1-1v-3zM10 6h4v2h-4V6z"/></svg>
        </div>
        <div id="headlight-low" class="ci" title="Low beam">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6a6 6 0 0 1 6 6 6 6 0 0 1-6 6V6z"/><line x1="3" y1="9" x2="8" y2="10.5"/><line x1="3" y1="12" x2="8" y2="13"/><line x1="3" y1="15" x2="8" y2="15.5"/></svg>
        </div>
        <div id="headlight-high" class="ci" title="High beam">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6a6 6 0 0 1 6 6 6 6 0 0 1-6 6V6z"/><line x1="2" y1="8" x2="8" y2="8"/><line x1="2" y1="12" x2="8" y2="12"/><line x1="2" y1="16" x2="8" y2="16"/></svg>
        </div>
        <div id="seatbelts" class="ci" title="Seatbelt">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="4" r="2.2"/><path d="M8 8h8l-1 7h-2l-.5 7h-1L11 15H9z" opacity=".9"/><path d="M15.6 7.6 8 17.8l1.2.9 7.6-10.2z" fill="#0b0b0d"/></svg>
        </div>
        <div id="door-lock" class="ci" title="Door lock">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
      </div>

      <!-- GAUGE SPEED -->
      <div class="gauge" id="spd-gauge">
        <svg id="spd-svg" viewBox="0 0 240 240"></svg>
        <div class="readout">
          <div class="row big"><span id="speed-display" class="num speed-text"><span class="dim">00</span><span class="bright">0</span></span><span class="unit" id="speed-mode">mph</span></div>
          <div class="row-lbl">SPEED</div>
          <div class="row small"><span id="gear" class="num gear-main">N</span><span class="unit">GEAR</span></div>
          <div class="row-lbl">&nbsp;</div>
        </div>
      </div>

      <!-- KOLOM KANAN -->
      <div class="side right">
        <div class="tile" id="tile-ign">
          <div class="body"><span class="val" id="ign-val">0</span><span class="unit">°</span><span class="lbl">IGN ANGLE</span></div>
          <div class="bar"><i></i></div>
        </div>
        <div class="tile" id="tile-tps">
          <div class="body"><span class="val" id="tps-val">0</span><span class="unit">%</span><span class="lbl">TPS</span></div>
          <div class="bar"><i></i></div>
        </div>
        <div class="tile" id="tile-batt">
          <div class="body"><span class="val" id="batt-val">12.6</span><span class="unit">V</span><span class="lbl">BATTERY</span></div>
          <div class="bar"><i></i></div>
        </div>
        <!-- Engine Health, tampil sebagai OIL PRESSURE -->
        <div class="tile" id="tile-health">
          <div class="body"><span class="val" id="health-val">--</span><span class="unit">%</span><span class="lbl">OIL PRESSURE</span></div>
          <div class="bar"><i></i></div>
        </div>
      </div>

    </div>

    <div class="brand">JGVRP</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
