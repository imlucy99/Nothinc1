<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JGVRP Speedometer HUD</title>
  <meta name="description" content="Custom digital speedometer HUD untuk JGVRP: RPM arc merah, speed MPH, oil pressure, fuel, dan indikator kendaraan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="hud-wrap">
    <div class="cluster booting" id="hud">

      <!-- Semua arc, tick, angka & jarum digambar oleh script.js -->
      <svg id="dial" class="dial" viewBox="0 0 500 340" xmlns="http://www.w3.org/2000/svg"></svg>

      <!-- ===== GEAR (kiri atas) & ODO (kanan atas) ===== -->
      <div class="corner gear-box">
        <span class="c-lbl">GEAR</span>
        <span class="gear-val" id="gear">N</span>
      </div>
      <div class="corner odo-box">
        <span class="c-lbl">ODO</span>
        <span class="odo-val"><span id="odometer">0.0</span><small>mi</small></span>
      </div>

      <!-- ===== READOUT TENGAH ===== -->
      <div class="center">
        <span class="unit">MPH</span>
        <div id="speed-display" class="speed"><span class="dim">00</span><span class="bright">0</span></div>

        <!-- Baris indikator (menggantikan RPM digital) -->
        <div class="status-row">

          <!-- Lampu: SATU ikon. Mati = redup, low = hijau (garis miring), high = biru (garis lurus) -->
          <div id="headlight" class="icon-item" title="Headlight">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 4h2a8 8 0 0 1 0 16h-2z" fill="currentColor" fill-opacity=".15"/>
              <g class="beam-low"><path d="M9 5L2 7.5M9 9L2 11.5M9 13L2 15.5M9 17L2 19.5"/></g>
              <g class="beam-high"><path d="M9 6H2M9 10H2M9 14H2M9 18H2"/></g>
            </svg>
          </div>

          <!-- Seatbelt: merah = belum dipasang, hijau = terpasang -->
          <div id="seatbelts" class="icon-item warn" title="Seatbelt">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="4" r="2.2" fill="currentColor" stroke="none"/>
              <path d="M8 22v-5.5L7 11.5C7 9.6 8.4 8 10.2 8h3.6C15.6 8 17 9.6 17 11.5l-1 5V22"/>
              <path d="M9 8.5l7.5 10"/>
            </svg>
          </div>

          <!-- Kunci: gembok tertutup kuning = kendaraan terkunci, gembok terbuka redup = tidak terkunci -->
          <div id="door-lock" class="icon-item" title="Vehicle Lock">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="15.2" r="1.4" fill="#0a0b0d" stroke="none"/>
              <path class="shackle-closed" d="M8 11V8a4 4 0 0 1 8 0v3"/>
              <path class="shackle-open" d="M8 11V8a4 4 0 0 1 7.4-2.1"/>
            </svg>
          </div>

        </div>
        <div class="shift" id="shift-light">SHIFT</div>
      </div>

      <!-- ===== INTRO ANNIS (tampil sekali saat HUD pertama dipakai) ===== -->
      <div class="intro" id="intro">
        <!-- Logo sendiri: taruh file "logo.png" di folder yang sama. Kalau file ada, otomatis dipakai
             dan emblem + tulisan bawaan di bawah disembunyikan. -->
        <img class="intro-logo" src="logo.png" alt="" onload="document.getElementById('intro').classList.add('has-logo')" onerror="this.remove()">
        <svg class="intro-emblem" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-linecap="round">
          <circle class="ring" cx="32" cy="32" r="28" stroke-width="4"/>
          <path class="arc" d="M18 36a14 14 0 0 0 28 0" stroke-width="3" stroke="#ff2a2f"/>
          <circle class="dot" cx="32" cy="24" r="4" fill="#fff" stroke="none"/>
        </svg>
        <div class="intro-text"><span>A</span><span>N</span><span>N</span><span>I</span><span>S</span></div>
        <i class="intro-line"></i>
      </div>

      <!-- ===== NILAI ARC SAMPING ===== -->
      <div class="arc-val fuel">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
        <span id="fuel-val">0</span><small>%</small>
      </div>
      <div class="arc-val oil" id="oil-box">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 10h4.2l1.3-2h2V6.5H8V5h6v1.5h-2V8h2.5l2 1.8 5-2.8 1 1.2-6.6 7.3H8.4L7 13H2.5zM20.2 14.6c0-.9 1.1-2.3 1.1-2.3s1.1 1.4 1.1 2.3c0 .6-.5 1.1-1.1 1.1s-1.1-.5-1.1-1.1z"/></svg>
        <span id="oil-val">0</span><small>psi</small>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
