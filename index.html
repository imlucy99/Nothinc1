<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedometer HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="hud sweeping" id="hud">

    <!-- Tombol dekoratif kiri -->
    <div class="btns">
      <span class="btn">&#9664;</span>
      <span class="btn">&#9660;</span>
      <span class="btn">&#10005;</span>
    </div>

    <!-- LAYAR -->
    <div class="screen">

      <!-- INTRO: siluet mobil -->
      <div class="intro" id="intro">
        <div class="stage">
          <div class="beam"></div>
          <svg class="car" viewBox="0 0 384 110" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="scan" gradientUnits="userSpaceOnUse" x1="-90" y1="0" x2="-20" y2="0">
                <stop offset="0" stop-color="#ffffff" />
                <stop offset="1" stop-color="#2c2c32" />
                <animateTransform id="scan-anim" attributeName="gradientTransform" type="translate"
                  from="0 0" to="520 0" begin="0.9s" dur="1.3s" fill="freeze" />
              </linearGradient>
            </defs>
            <g fill="url(#scan)">
              <path d="M12,80 L12,72 C12,67 22,65 36,62 L76,54 L112,40 C124,34 140,31 160,31 L212,31 C228,32 240,36 250,43 L272,54 L336,58 L356,50 L374,48 L374,58 C376,68 372,76 366,80 L332,80 A28,28 0 0 0 276,80 L128,80 A28,28 0 0 0 72,80 Z"/>
              <circle cx="100" cy="80" r="24"/>
              <circle cx="304" cy="80" r="24"/>
            </g>
            <circle cx="100" cy="80" r="13" fill="#0a0a0d"/>
            <circle cx="304" cy="80" r="13" fill="#0a0a0d"/>
            <path d="M118,43 L148,36 L210,36 C222,37 232,40 240,46 L252,53" fill="none" stroke="#0a0a0d" stroke-width="1.5"/>
          </svg>
        </div>
      </div>

      <!-- BARIS ATAS: sein + check engine -->
      <div class="top-bar">
        <div id="indicator-left" class="icon-item arrow">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </div>
        <div id="engine-icon" class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22 12c0-.6-.4-1-1-1h-2V9c0-.6-.4-1-1-1h-2V5c0-.6-.4-1-1-1H9c-.6 0-1 .4-1 1v3H6c-.6 0-1 .4-1 1v2H3c-.6 0-1 .4-1 1v3c0 .6.4 1 1 1h2v2c0 .6.4 1 1 1h12c.6 0 1-.4 1-1v-2h2c.6 0 1-.4 1-1v-3zM10 6h4v2h-4V6z"/>
          </svg>
        </div>
        <div id="indicator-right" class="icon-item arrow">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </div>
      </div>

      <div class="main">

        <!-- KOLOM KIRI (tile kuning) -->
        <div class="side">
          <div class="ytile">
            <span class="lbl">OIL PRESS</span>
            <span class="val"><span id="health-val">--</span><small>%</small></span>
            <div id="health-segments" class="segs"></div>
          </div>
          <div class="ytile">
            <span class="lbl">FUEL</span>
            <span class="val"><span id="fuel-val">--</span><small>%</small></span>
            <div id="fuel-segments" class="segs"></div>
          </div>
          <div class="ytile">
            <span class="lbl">ODO</span>
            <span id="odometer" class="val">0.0 mi</span>
          </div>
          <div class="ytile">
            <span class="lbl">RPM</span>
            <span id="rpm-val" class="val">0</span>
          </div>
        </div>

        <!-- GAUGE TENGAH -->
        <div class="gauge" id="rpm-gauge">
          <svg id="rpm-svg" viewBox="0 0 300 300"></svg>
          <div class="center">
            <span class="brand">JGVRP</span>
            <div id="speed-display" class="speed-text">
              <span class="dim">00</span><span class="bright">0</span>
            </div>
            <span class="unit" id="speed-mode">MPH</span>
            <div class="gear-row"><span class="lbl">GEAR</span><span id="gear" class="gear-main">1</span></div>
          </div>
        </div>

        <!-- KOLOM KANAN (indikator) -->
        <div class="side">
          <div id="headlight-low" class="icon-item tile">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 6a6 6 0 0 1 6 6 6 6 0 0 1-6 6V6z"/>
              <line x1="3" y1="9" x2="7" y2="10"/><line x1="3" y1="12" x2="7" y2="12"/><line x1="3" y1="15" x2="7" y2="14"/>
            </svg><span>LOW</span>
          </div>
          <div id="headlight-high" class="icon-item tile">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 6a6 6 0 0 1 6 6 6 6 0 0 1-6 6V6z"/>
              <line x1="2" y1="8" x2="7" y2="8"/><line x1="2" y1="12" x2="7" y2="12"/><line x1="2" y1="16" x2="7" y2="16"/>
            </svg><span>HIGH</span>
          </div>
          <div id="seatbelts" class="icon-item tile">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 2v2h10V2H7zm10 18v2H7v-2h10zM10 6h4v3h-4V6zm0 9h4v3h-4v-3zm1-4.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5z"/>
            </svg><span>BELT</span>
          </div>
          <div id="door-lock" class="icon-item tile">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg><span>LOCK</span>
          </div>
        </div>

      </div>
    </div>

    <!-- Tombol dekoratif kanan -->
    <div class="btns">
      <span class="btn">+</span>
      <span class="btn">&#9650;</span>
      <span class="btn">&#9654;</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
